<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Payment Confirmation | Premiere Flow</title>
    <meta name="referrer" content="no-referrer">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="../style.css">
</head>
<body style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; text-align: center; background: #000; color: #fff; padding: 20px; font-family: sans-serif;">
    
    <h1 id="payment-heading" style="font-size: 3.5rem; letter-spacing: -2px; margin: 0;">VERIFYING PAYMENT</h1>
    
    <div style="background: #080808; border: 1px solid #1a1a1a; padding: 40px; border-radius: 24px; margin-top: 30px; max-width: 500px; width: 100%; box-sizing: border-box;">
        <p id="payment-summary" role="status" aria-live="polite" style="color: #fff; font-weight: 700; margin-bottom: 10px; font-size: 1.2rem;">Waiting for secure payment confirmation.</p>
        
        <div style="margin: 20px 0;">
            <p id="payment-detail" style="color: #aaa; font-size: 0.9rem; line-height: 1.6; margin-top: 15px;">
                This page will update after your payment and account are confirmed.
            </p>
        </div>

        <a href="../" class="get-started-btn" style="text-decoration: none; display: block; background: #fff; color: #000; padding: 15px; border-radius: 8px; font-weight: 800; margin-top: 20px;">RETURN TO HOMEPAGE</a>
    </div>
    
    <p style="margin-top: 40px; font-size: 11px; color: #333; text-transform: uppercase; letter-spacing: 2px;">Questions? Email info@premiereflow.com</p>

<script src="/portal.js"></script>
    <script>
        const sessionId = new URLSearchParams(location.search).get('session_id');
        const heading = document.getElementById('payment-heading');
        const summary = document.getElementById('payment-summary');
        const detail = document.getElementById('payment-detail');
        const startedAt = Date.now();
        let finished = false;
        async function verifyPayment() {
            if (!sessionId || !/^cs_(live|test)_[A-Za-z0-9]+$/.test(sessionId)) {
                heading.textContent = 'CONFIRMATION UNAVAILABLE';
                summary.textContent = 'Open the confirmation link from your checkout.';
                detail.textContent = 'A visit to this page does not confirm a payment or create an account.';
                return;
            }
            try {
                const result = await PF.request('/api/checkout/status?session_id=' + encodeURIComponent(sessionId));
                if (result.status === 'ready' && result.invitation === 'sent') {
                    heading.textContent = 'PAYMENT CONFIRMED';
                    summary.textContent = 'Your account is ready.';
                    detail.textContent = 'Your purchase is confirmed and your account email has been sent. Open it to set your password or sign in.';
                    finished = true;
                } else if (result.status === 'failed') {
                    heading.textContent = 'PAYMENT NOT COMPLETED';
                    summary.textContent = 'This checkout did not complete successfully.';
                    detail.textContent = 'No credits were added. Return to Select Plan to try again.';
                    finished = true;
                } else {
                    summary.textContent = result.status === 'provisioning' ? 'Payment confirmed. Preparing your account and email…' : 'Waiting for secure payment confirmation.';
                    detail.textContent = 'You can leave this page and return using the same link. Please do not pay again while confirmation is pending.';
                }
            } catch (error) {
                summary.textContent = 'We could not check your payment yet.';
                detail.textContent = error.message + ' Please do not pay again until its status is confirmed.';
            }
            if (!finished && Date.now() - startedAt < 180000) setTimeout(verifyPayment, 5000);
            else if (!finished) detail.textContent = 'Confirmation is taking longer than expected. Check your email or contact info@premiereflow.com before attempting another payment.';
        }
        verifyPayment();
    </script>
</body>
</html>
